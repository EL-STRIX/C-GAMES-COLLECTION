name: Auto Approve Pull Requests
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: hmarr/auto-approve-action@v4
        with:
          # Provide a personal access token (PAT) from a bot account that has permission
          # to approve pull requests. Create a repository secret named AUTO_APPROVE_TOKEN
          # and set it to that PAT. Do NOT use the same account that opens PRs.
          github_token: ${{ secrets.AUTO_APPROVE_TOKEN }}
