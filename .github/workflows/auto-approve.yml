name: Auto Approve

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  approve:
    if: >
      github.actor == 'dependabot[bot]' ||
      github.actor == 'renovate[bot]'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: hmarr/auto-approve-action@v4