name: Auto Approve Pull Requests
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'github-actions[bot]' && github.actor != 'github-actions[bot]' && github.actor != 'github-actions'
    permissions:
      pull-requests: write
    steps:
      - uses: hmarr/auto-approve-action@v4
